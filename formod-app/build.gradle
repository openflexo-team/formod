dependencies {

  implementation project(':formod-module')
  implementation project(':formod-rc')

  // ./gradlew :formod:formod-app:run -PwithModeller adds the OpenFlexo Modeller (the standard FML tools) to the classpath,
  // to diagnose a project from within the running application
  if (project.hasProperty('withModeller')) {
    runtimeOnly openflexoModule("om-module")
  }

  testImplementation flexoFoundation()
  testImplementation flexoUi()
  testImplementation flexoFoundationTest()
  testImplementation flexoUiTest()

  if (JavaVersion.current().isJava9Compatible()) {
  }
}

apply plugin: 'application'
application {
  mainClass = "org.openflexo.Flexo"
}

// ./gradlew :formod:formod-app:jpackage builds the native installer of the platform (see the buildplugin)
jpackage {
  appName = 'Formod'
  description = 'Formod application'
  vendor = 'Formose consortium'
  iconMac = file('src/main/resources/Icons/IconOpenflexo.icns')
}
